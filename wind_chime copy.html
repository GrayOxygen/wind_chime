    // 实现一个game loop：来回摇摆的移动
    let angle = 0;
    function update() { 
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        angle += 0.05;
        const x = 300 + Math.sin(angle) * 100;
        // draw bell
        ctx.beginPath();
        ctx.arc(x, 180, 20, 0, Math.PI * 2);
        ctx.fill();
        requestAnimationFrame(update); 
    } 
    update();
