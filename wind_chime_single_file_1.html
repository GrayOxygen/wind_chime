<html lang="en">
    <body>
        <button id="startButton">Start</button>
        <div id="status">Ready</div>
        <canvas id="canvas" width="1800" height="800"></canvas>
    </body>
    <script>
        /**
         * 实现:  
         * 1，球体水平摆动
         * 思考：
         * 如果球走出canvas，如何走回来？
         * 作业：
         * 1，画三根绳子，保证在球运动时，仍与球体相连
         * 2，为代码加上必要的注释
         *
         */

        // 画布
        const canvas = document.querySelector("#canvas");
        const ctx = canvas.getContext("2d");

        // 风铃对象
        class Chime {
            constructor(x, y, speed) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.angle = 0;
            }
            update() {
                this.angle += this.speed;
            }
            draw(ctx) {
                const swing = Math.sin(this.angle) * 100;
                const nextX = this.x + swing;
                // 画球形
                ctx.beginPath();
                ctx.arc(nextX, this.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = "green";
                ctx.fill();
            }
        }

        // 多个风铃实例
        const chimes = [
            new Chime(150, 200, 0.02),
            new Chime(250, 200, 0.01),
            new Chime(350, 200, 0.03),
        ];

        // game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const chime of chimes) {
                chime.update();
                chime.draw(ctx);
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</html>
